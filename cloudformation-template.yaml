AWSTemplateFormatVersion: '2010-09-09'
Description: DRI Infrastructure — S3 bucket and IAM role for GitHub Actions

Parameters:
  GitHubOrg:
    Type: String
    Default: hoppefamily
    Description: GitHub organization or username

  GitHubRepo:
    Type: String
    Default: dri
    Description: GitHub repository name

  BucketNamePrefix:
    Type: String
    Default: dri-data
    Description: S3 bucket name prefix (will be suffixed with account ID)

Resources:
  DRIBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketNamePrefix}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: DRI
        - Key: ManagedBy
          Value: CloudFormation

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-github-actions'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': 'sts.amazonaws.com'
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${GitHubRepo}:*'
      Policies:
        - PolicyName: DRIDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3ReadWrite
                Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:GetObject'
                  - 's3:DeleteObject'
                  - 's3:ListBucket'
                Resource:
                  - !GetAtt DRIBucket.Arn
                  - !Sub '${DRIBucket.Arn}/*'
              - Sid: S3ListAllBuckets
                Effect: Allow
                Action:
                  - 's3:ListAllMyBuckets'
                Resource: '*'
      Tags:
        - Key: Project
          Value: DRI
        - Key: ManagedBy
          Value: CloudFormation

  # Optional: CloudWatch Log Group for monitoring
  DRILogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /dri/pipeline
      RetentionInDays: 30

Outputs:
  BucketName:
    Description: Name of the DRI data bucket
    Value: !Ref DRIBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  BucketArn:
    Description: ARN of the DRI data bucket
    Value: !GetAtt DRIBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BucketArn'

  RoleArn:
    Description: ARN of the GitHub Actions IAM role
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RoleArn'

  SetupInstructions:
    Description: Setup instructions for GitHub repository
    Value: !Sub |
      Add these secrets to your GitHub repository:

      1. AWS_ROLE_ARN: ${GitHubActionsRole.Arn}
      2. S3_BUCKET: ${DRIBucket}
      3. SEC_USER_AGENT: YourCompany your@email.com

      Then configure the OIDC provider:
      https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
