# DRI Configuration
panel:
  # Panel of discretionary macro managers (minimum 4 required)
  # CIKs validated on SEC EDGAR with consistent 13F-HR filing history

  - cik: "0001536411"
    name: "Duquesne Family Office"
    principal: "Stanley Druckenmiller"
    decay_type: "tactical"
    decay_halflife_days: 30

  - cik: "0001336528"
    name: "Pershing Square Capital Management"
    principal: "Bill Ackman"
    decay_type: "structural"
    decay_halflife_days: 60

  - cik: "0001600319"
    name: "Bridgewater Advisors"
    principal: "Ray Dalio"
    decay_type: "structural"
    decay_halflife_days: 60

  - cik: "0001040273"
    name: "Third Point"
    principal: "Dan Loeb"
    decay_type: "structural"
    decay_halflife_days: 60

  # Guy Spier / Aquamarine Zurich
  - cik: "0001953324"
    name: "Aquamarine Zurich"
    principal: "Guy Spier"
    decay_type: "structural"
    decay_halflife_days: 60

normalization:
  window_years: 5           # Rolling max window
  method: "rolling_max"     # Options: rolling_max, full_history_max

regime:
  # Exposure thresholds (0-1 scale)
  high_exposure: 0.65
  low_exposure: 0.35

  # Dispersion thresholds
  high_dispersion: 0.15
  dispersion_rising_threshold: 0.03

  # Delta thresholds
  fast_contraction_delta: -0.15

  # Minimum panel size
  min_panel_members: 4

storage:
  output_dir: "./data"
  s3_bucket: null           # Optional: S3 bucket for storage
  s3_prefix: "dri"

edgar:
  user_agent: null          # Set via SEC_USER_AGENT env var (required)
  rate_limit_per_sec: 10
  retry_attempts: 3
  retry_delay_sec: 2
  base_url: "https://www.sec.gov"
